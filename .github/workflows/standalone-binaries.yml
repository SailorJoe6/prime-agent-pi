name: Standalone binaries

on:
  workflow_dispatch:
    inputs:
      public_version:
        description: Pi public version (build evidence only)
        required: true
        type: string
      preview_sequence:
        description: Positive preview sequence; leave blank for stable identity
        required: false
        type: string
      catalog_sha:
        description: Exact Prime Agent catalog commit SHA
        required: true
        type: string
  workflow_call:
    inputs:
      build_ref:
        type: string
        required: false
        default: ''
      public_version:
        type: string
        required: false
      preview_sequence:
        type: string
        required: false
      catalog_sha:
        type: string
        required: false
      python_smoke_diagnostics:
        type: boolean
        required: false
    secrets:
      PRIME_CATALOG_REPO_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Standalone (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Darwin builds must be compiled and signed on their own architecture.
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          # Bun cross-compiles musl and baseline targets, so each Linux variant is
          # built on the runner whose architecture it targets and then executed on
          # that architecture: glibc archives on the runner, musl archives in Alpine.
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: linux-arm64-musl
            runner: ubuntu-24.04-arm
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-x64-baseline
            runner: ubuntu-24.04
          - platform: linux-x64-musl
            runner: ubuntu-24.04
          - platform: linux-x64-musl-baseline
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.build_ref || github.sha }}
          persist-credentials: false
          path: source

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
          no-cache: true

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.7'
          enable-cache: false

      - name: Install native development dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install locked npm dependencies
        working-directory: source
        run: npm ci

      - name: Require a pinned Pi catalog commit
        if: inputs.public_version != ''
        env:
          CATALOG_SHA: ${{ inputs.catalog_sha }}
        run: |
          [[ "$CATALOG_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout catalog assets
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: PrimeIntellect-ai/prime-agent-catalog
          ref: ${{ inputs.catalog_sha || 'main' }}
          token: ${{ secrets.PRIME_CATALOG_REPO_TOKEN || github.token }}
          path: prime-agent-catalog
          persist-credentials: false

      - name: Generate catalog assets
        if: inputs.public_version == ''
        working-directory: source
        run: npm run catalog:assets -- --catalog-dir ../prime-agent-catalog

      - name: Compile standalone application
        if: inputs.public_version == ''
        working-directory: source/packages/coding-agent
        run: npm run build:binary -- --platform ${{ matrix.platform }}

      - name: Assemble native archive
        if: inputs.public_version == ''
        working-directory: source
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/assemble-release-archives.mjs packages/coding-agent/binaries "$RUNNER_TEMP/standalone" "$version"
          echo "PRIME_AGENT_TEST_ARCHIVE=$RUNNER_TEMP/standalone/prime-agent-$version-${{ matrix.platform }}.tar.gz" >> "$GITHUB_ENV"
          echo "PRIME_AGENT_TEST_UV=$(command -v uv)" >> "$GITHUB_ENV"

      - name: Prepare a verified wheel for the Intel Python smoke
        if: inputs.public_version == '' && matrix.platform == 'darwin-x64'
        working-directory: source
        timeout-minutes: 8
        run: bash scripts/prepare-intel-python-smoke.sh "$RUNNER_TEMP/intel-python-smoke"

      - name: Remove the build paths from the test machine
        if: inputs.public_version == ''
        run: mv "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/standalone-source"

      # A musl archive cannot execute on the glibc runner that cross-compiled it, and
      # the checkout's node_modules are glibc builds, so Vitest cannot move into Alpine
      # either. musl archives are executed by the Alpine step below instead.
      - name: Test extracted application without JavaScript runtimes on PATH
        if: ${{ inputs.public_version == '' && !contains(matrix.platform, 'musl') }}
        working-directory: ${{ runner.temp }}/standalone-source/packages/coding-agent
        env:
          PRIME_AGENT_TEST_UV_CONSTRAINT: ${{ matrix.platform == 'darwin-x64' && format('{0}/intel-python-smoke/constraints.txt', runner.temp) || '' }}
          PRIME_AGENT_PYTHON_SMOKE_DIAGNOSTICS: ${{ inputs.python_smoke_diagnostics && matrix.platform == 'darwin-x64' && '1' || '' }}
        run: |
          if [[ -n "$PRIME_AGENT_TEST_UV_CONSTRAINT" ]]; then
            shasum -a 256 -c "${PRIME_AGENT_TEST_UV_CONSTRAINT%/*}/wheel.sha256"
          fi
          npx tsx ../../node_modules/vitest/dist/cli.js --run test/release-signatures.test.ts test/compiled-artifact.test.ts test/native-installer.test.ts test/native-probe-timeout.test.ts

      # Real musl execution evidence: Alpine has no glibc and no JavaScript runtime.
      # Bun's musl executables link against libstdc++, which Alpine does not preinstall.
      - name: Test extracted application on Alpine without JavaScript runtimes
        if: ${{ inputs.public_version == '' && contains(matrix.platform, 'musl') }}
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          version=$(node -p "require('$RUNNER_TEMP/standalone-source/package.json').version")
          docker run --rm --init \
            --volume "$RUNNER_TEMP/standalone:/archives:ro" \
            --env "ARCHIVE=prime-agent-$version-$TARGET_PLATFORM.tar.gz" \
            --env "VERSION=$version" \
            --env DO_NOT_TRACK=1 \
            --env PI_OFFLINE=1 \
            --env PRIME_AGENT_INSTALL_UV=0 \
            alpine:3.21 sh -eu -c '
              apk add --no-cache libstdc++ > /dev/null
              for runtime in node npm bun deno; do
                if command -v "$runtime" >/dev/null 2>&1; then
                  echo "A JavaScript runtime must not be present: $runtime" >&2
                  exit 1
                fi
              done
              mkdir /application
              tar -xzf "/archives/$ARCHIVE" -C /application
              test "$(timeout 60 /application/prime-agent --version)" = "$VERSION"
              timeout 60 /application/prime-agent --help > /dev/null
            '

      - name: Build Prime Agent Pi archive and receipt
        if: inputs.public_version != ''
        working-directory: source
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          PUBLIC_VERSION: ${{ inputs.public_version }}
          PREVIEW_SEQUENCE: ${{ inputs.preview_sequence }}
        run: |
          args=("$TARGET_PLATFORM" ../prime-agent-catalog "$RUNNER_TEMP/pi-native" "$PUBLIC_VERSION")
          if [[ -n "$PREVIEW_SEQUENCE" ]]; then args+=("$PREVIEW_SEQUENCE"); fi
          node_modules/.bin/tsx scripts/build-pi-native-archive.mjs "${args[@]}"

      - name: Verify extracted Pi archive
        if: inputs.public_version != ''
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          bash source/scripts/smoke-pi-native-archive.sh "$RUNNER_TEMP/pi-native" "$TARGET_PLATFORM"

      - name: Upload tested Pi build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: inputs.public_version != ''
        with:
          name: pi-native-${{ matrix.platform }}
          path: ${{ runner.temp }}/pi-native/*
          if-no-files-found: error

      - name: Upload standalone reference
        if: inputs.public_version == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: standalone-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/standalone/*.tar.gz
            ${{ runner.temp }}/standalone/SHA256SUMS
            ${{ runner.temp }}/standalone/binaries.json
          if-no-files-found: error
